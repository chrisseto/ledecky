[default]
address = "127.0.0.1"
# Fixed on purpose: hook URLs handed to `claude --settings` must be stable, and
# stable enough for a user to put in `allowedHttpHookUrls` if they ever set it.
port = 8770

# Names the data directory and the `refs/<app_slug>/<card>/` namespace. Not a
# bare `kanban`, so the refs cannot collide with other tooling.
app_slug = "kanban2"

# The executable spawned for an agent. The end-to-end suite points this at a
# scripted stand-in.
agent_bin = "claude"

# data_dir defaults to $XDG_DATA_HOME/<app_slug>; set it to override.
