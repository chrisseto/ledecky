[default]
address = "127.0.0.1"
port = 8770

# Hooks are served on a socket of their own. Loopback because agents run here,
# and the URLs handed to them name whatever this says. The port is fixed on
# purpose: those URLs must be stable, and stable enough for a user to put in
# `allowedHttpHookUrls` if they ever set it.
hook_address = "127.0.0.1"
hook_port = 8771

# Names the data directory and the `refs/<app_slug>/<card>/` namespace.
app_slug = "ledecky"

# The executable spawned for an agent. The end-to-end suite points this at a
# scripted stand-in.
agent_bin = "claude"

# Extra environment for that executable, on top of what this server inherited.
# The end-to-end suite uses it to tell its stand-in how long to pretend to start
# up for.
agent_env = {}

# How long a burst of worktree writes settles for, in milliseconds, before the
# diff is announced as moved. The end-to-end suite shrinks it.
watch_debounce = 250

# How long a staged worktree head stays good without the watcher saying
# otherwise, in milliseconds. A backstop for a missed event, not the mechanism.
head_ttl = 30000

# Whether to gzip responses. Unset, it follows the build: on in release, off in
# debug. Not set here, since any value would override that.
# gzip = true

# data_dir defaults to $XDG_DATA_HOME/<app_slug>; set it to override.

# The waits this server makes in real time while driving an agent, in
# milliseconds — not the agent's own timings, which are the agent's business.
# Listed here to document them; `Settings` carries the same values as defaults,
# so deleting any of these changes nothing. The end-to-end suite overrides them
# with `LEDECKY_*` so it does not have to wait in real time.
#
#   hook_grace      how long to wait for any hook before reporting misconfigured
#   startup_timeout how long a starting session has to report in
#   dialog_grace    how long a requested dialog has to paint
#   submit_grace    how long to wait for the hook that says the session took it
hook_grace = 15000
startup_timeout = 5000
dialog_grace = 5000
submit_grace = 1500
