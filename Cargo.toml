[package]
name = "kanban2"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
minijinja = { version = "2", features = ["loader"] }
portable-pty = "0.9"
rocket = { version = "0.5", features = ["json"] }
rocket_ws = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
tokio = { version = "1", features = ["sync", "process", "io-util", "time"] }
vt100 = "0.16"
