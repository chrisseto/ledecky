[package]
name = "ledecky"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
include_dir = "0.7.4"
minijinja = { version = "2", features = ["loader", "urlencode"] }
notify = "8.2.0"
portable-pty = "0.9"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rocket = { version = "0.5", features = ["json"] }
rocket_ws = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "process", "io-util", "time"] }
vt100 = "0.16"
