<aside class="drawer drawer-projects" aria-label="Projects">
  <div class="drawer-head">
    <h2>Projects</h2>
    <span class="spacer"></span>

    <a class="btn accent" href="/projects/new{% if project %}?board={{ project.id }}{% endif %}"
       hx-get="/projects/new{% if project %}?board={{ project.id }}{% endif %}" hx-target="#overlay" hx-select="#overlay" hx-swap="outerMorph" hx-push-url="true">{{ icon("plus") }} Add project</a>

    <a class="btn icon-only" href="{% if project %}/projects/{{ project.id }}{% else %}/{% endif %}" aria-label="Close" data-close-overlay
       hx-get="{% if project %}/projects/{{ project.id }}{% else %}/{% endif %}" hx-target="#overlay" hx-select="#overlay" hx-swap="outerMorph" hx-push-url="true">{{ icon("x") }}</a>
  </div>

  <div class="project-list">
    {% for entry in projects %}
      <a class="project-card {% if project and entry.id == project.id %}current{% endif %}"
         href="/projects/{{ entry.id }}">
        <span class="name">
          <span class="dot hue-{{ entry.id % 4 }}"></span>{{ entry.name }}
          <span class="count">
            {{ entry.cards }} card{{ "" if entry.cards == 1 else "s" }}
          </span>
        </span>
        <span class="path mono">{{ entry.path }}</span>
      </a>
    {% endfor %}
  </div>
</aside>
