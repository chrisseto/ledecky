<article class="card" data-card-id="{{ card.id }}">
  <a class="card-open" href="/cards/{{ card.id }}" up-follow up-target="#overlay">
    {{ card.title }}
  </a>

  <div class="card-meta">
    <span class="branch mono">{{ icon("git-branch") }} {{ card.base_branch }}</span>

    {% if card.agent_state != "stopped" %}
      <span class="pulse state-{{ card.agent_state }}"
            title="{{ card.agent_state_label }}"></span>
    {% endif %}

    {% if card.stat %}
      <span class="stat mono">
        <span class="adds">+{{ card.stat.additions }}</span>
        <span class="dels">−{{ card.stat.deletions }}</span>
      </span>
    {% endif %}
  </div>
</article>
